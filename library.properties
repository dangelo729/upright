sentence=A physically modelled piano for the Teensy Audio Library: a struck string is a mode table, driven by a felt hammer in a loop and heard through a soundboard or a pickup; grand, upright, Rhodes and Wurlitzer by numbers, not by mechanism, one voice or a polyphonic pool sharing one soundboard.
paragraph=You do not pick a piano; you set its scale, its hammers, where they strike, how many strings a note has, its body, what the hammer hits and how it is heard, and how it is damped, and the sound is the consequence. Eight signed knobs named for the ear (scale, hammer, strike, unison, body, generator, pickup, damper) set the instrument's dimensions with an exact read-back and a measured level table, so a knob moves the piano, not the volume; nine presets run from a concert grand and an upright to a Rhodes and a Wurlitzer. A rank turns the string at middle C into the string at every key (its length, its wire plain or wound, its stiffness, its hammer and where it lands), and a law turns them into every partial's frequency, decay, strike-point gain and output weight: a stiff string's inharmonic partials at one end, a Rhodes tine's and a Wurlitzer reed's at the other, interpolated between. The partial table is part of the channel table, so a measured string plays directly and one partial can be retuned by hand. A felt hammer meets the string, compresses by a power law and is thrown off by the string's own reply, so velocity becomes brightness and a key struck again meets its moving string; unison strings beat and decay in two stages; a released key's damper lands unless the sustain pedal holds it. The acoustic side is heard through a soundboard that is a plate's mode table, the electric side through a magnetic or electrostatic pickup's bounded curve. AudioSynthUpright is one voice and its board; AudioSynthUprightPool<M> is M voices with a note table that steals the quietest by a fade, every key driving one shared board where its string crosses the bridge. The core compiles with nothing but the C++ standard library, allocates nothing, calls no libm per sample and is tested on a Mac.
